name: ci-wf
on:
   push:
     branches:
        - develop
   pull_request:
     branches:
       - develop
jobs:
  linting_job:
    runs-on: ubuntu-latest
    steps:
      - name: Welocome Message
        run: echo "Welcome to CI pipeline"
      - name: Clone the Repo
        uses: actions/checkout@v4
      - name: Installing HTMLLinter
        run: npm install --save-dev htmlhint
      - name: Run HTML Listner
        run: npm htmlhint "**/*.html"
